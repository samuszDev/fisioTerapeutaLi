<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fisioterapeuta Li · Agenda</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <img src="../assets/logo-li.png" alt="Logo">
        </div>

        <div class="sidebar-title">PANEL ADMINISTRATIVO</div>

        <nav class="sidebar-nav">
            <button class="nav-item" data-page="dashboard" data-href="../dashboard/dashboard.html"><img src="../assets/dashboard.svg" alt="" aria-hidden="true"><span>Dashboard</span></button>
            <button class="active nav-item" data-page="agenda" data-href="../agenda/agenda.html"><img src="../assets/calendar.svg" alt="" aria-hidden="true"><span>Agenda y citas</span></button>
            <button class="nav-item" data-page="clientes" data-href="../clientes/clientes.html"><img src="../assets/clients.svg" alt="" aria-hidden="true"><span>Clientes</span></button>
            <button class="nav-item" data-page="servicios" data-href="../servicios/servicios.html"><img src="../assets/services.svg" alt="" aria-hidden="true"><span>Servicios</span></button>
            <button class="nav-item" data-page="reportes" data-href="../reportes/reportes.html"><img src="../assets/reports.svg" alt="" aria-hidden="true"><span>Reportes</span></button>
        </nav>

        <div class="sidebar-footer">
            <span>Fisioterapeuta</span>
            <span>Ciudad / sede</span>
            <span>Horario de atención</span>
        </div>
    </aside>
    <main class="main-content">
        <header class="mobile-header">
            <button id="menuButton" class="menu-button">☰</button>
            <span>La Fisioterapeuta Li</span>
        </header>
        <section class="page active" id="agenda">
            <div class="page-header">
                <div>
                    <span class="eyebrow">GESTIÓN DE RESERVAS</span>
                    <h1>Agenda y citas</h1>
                    <p>Busca, filtra y revisa las reservas.</p>
                </div>

                <button class="btn btn-gold" data-open-view="new-appointment">+ Nueva Cita</button>
            </div>

            <div class="toolbar">
                <div class="filter-placeholder"></div>
                <button class="btn btn-outline">Filtrar</button>
            </div>

            <div class="panel">
                <div class="table-container">
                    <table class="wide-table">
                        <thead>
                        <tr>
                            <th>Fecha / hora</th>
                            <th>Paciente</th>
                            <th>Servicio</th>
                            <th>Sede</th>
                            <th>Pago</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                        </thead>
                        <tbody id="agendaRows">
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="edit-appointment">Editar</button></td>
                        </tr>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="edit-appointment">Editar</button></td>
                        </tr>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="edit-appointment">Editar</button></td>
                        </tr>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="edit-appointment">Editar</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel weekly-view">
                <div class="panel-title">Vista semanal</div>
                <div class="week-grid">
                    <div class="day"><strong>Lun</strong><div></div></div>
                    <div class="day"><strong>Mar</strong><div></div></div>
                    <div class="day"><strong>Mié</strong><div></div></div>
                    <div class="day"><strong>Jue</strong><div></div></div>
                    <div class="day"><strong>Vie</strong><div></div></div>
                    <div class="day"><strong>Sáb</strong><div></div></div>
                    <div class="day"><strong>Dom</strong><div></div></div>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-window">
        <div class="modal-header">
            <div>
                <span class="eyebrow" id="modalEyebrow"></span>
                <h2 id="modalTitle"></h2>
            </div>
            <button class="close-modal" id="closeModal" aria-label="Cerrar">×</button>
        </div>

        <div class="modal-content" id="modalContent"></div>

        <div class="modal-footer">
            <button class="btn btn-outline" id="modalCancel">Cancelar</button>
            <button class="btn btn-gold" id="modalFinish">Finalizado</button>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
