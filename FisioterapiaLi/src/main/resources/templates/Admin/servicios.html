<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fisioterapeuta Li · Servicios</title>
    <link rel="stylesheet" th:href="@{/css/Admin.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
</head>
<body>

<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <img th:src="@{/images/logo.png}" alt="Logo Fisioterapeuta Li">
            <div class="brand-text">
                <strong>La Fisioterapeuta Li</strong>
                <span>PANEL ADMINISTRATIVO</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" th:href="@{/admin/dashboard}">
                <span class="nav-dot"></span>
                <img th:src="@{/css/assets/dashboard.svg}" alt="" aria-hidden="true">
                <span>Dashboard</span>
            </a>
            <a class="nav-item" th:href="@{/admin/agenda}">
                <span class="nav-dot"></span>
                <img th:src="@{/css/assets/calendar.svg}" alt="" aria-hidden="true">
                <span>Agenda y citas</span>
            </a>
            <a class="nav-item" th:href="@{/admin/clientes}">
                <span class="nav-dot"></span>
                <img th:src="@{/css/assets/clients.svg}" alt="" aria-hidden="true">
                <span>Clientes</span>
            </a>
            <a class="nav-item active" th:href="@{/admin/servicios}">
                <span class="nav-dot"></span>
                <img th:src="@{/css/assets/services.svg}" alt="" aria-hidden="true">
                <span>Servicios</span>
            </a>
            <a class="nav-item" th:href="@{/admin/reportes}">
                <span class="nav-dot"></span>
                <img th:src="@{/css/assets/reports.svg}" alt="" aria-hidden="true">
                <span>Reportes</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="footer-header">
                <span class="footer-icon">
                    <svg viewBox="0 0 20 20" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="10" cy="7" r="3"/><path d="M4 17c.5-3 2.4-4.5 6-4.5s5.5 1.5 6 4.5"/>
                    </svg>
                </span>
                <strong>Lina Murillo (Fisioterapeuta)</strong>
            </div>
            <div class="footer-details">
                <span>Sede Tunja (L-V) / Turmequé (S-D)</span>
                <span>Lun - Dom: 7:00 a.m. - 8:00 p.m.</span>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="mobile-header">
            <button id="menuButton" class="menu-button">☰</button>
            <span>La Fisioterapeuta Li</span>
        </header>

        <section class="page active" id="servicios">
            <div class="page-header">
                <div class="dashboard-title-row">
                    <img th:src="@{/images/lina_murillo.png}" alt="Lina Murillo" class="title-avatar">
                    <div>
                        <h1>Servicios y tarifas</h1>
                        <p>Servicios disponibles para el agendamiento según portafolio.</p>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="btn btn-gold" data-open-view="new-service">+ Nuevo servicio</button>
                </div>
            </div>

            <div class="services-grid" id="serviciosGrid">
                <!-- Se cargará automáticamente desde servicios.js -->
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-window">
        <div class="modal-header">
            <div>
                <span class="eyebrow" id="modalEyebrow"></span>
                <h2 id="modalTitle"></h2>
            </div>
            <button class="close-modal" id="closeModal" aria-label="Cerrar">×</button>
        </div>

        <div class="modal-content" id="modalContent"></div>

        <div class="modal-footer">
            <button class="btn btn-outline" id="modalCancel">Cancelar</button>
            <button class="btn btn-gold" id="modalFinish">Finalizado</button>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/servicios.js}"></script>
</body>
</html>
