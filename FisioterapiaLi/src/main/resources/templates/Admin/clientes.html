<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fisioterapeuta Li · Clientes</title>
    <!-- Ruta exclusiva de Thymeleaf apuntando a static/css/ -->
    <link rel="stylesheet" th:href="@{/css/Admin.css}">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <!-- Ruta exclusiva de Thymeleaf apuntando a static/css/assets/ -->
            <img th:src="@{/css/assets/logo-li.png}" alt="Logo">
        </div>

        <div class="sidebar-title">PANEL ADMINISTRATIVO</div>

        <nav class="sidebar-nav">
            <a class="nav-item" th:href="@{/admin/dashboard}">
                <img th:src="@{/css/assets/dashboard.svg}" alt="" aria-hidden="true">
                <span>Dashboard</span>
            </a>
            <a class="nav-item" th:href="@{/admin/agenda}">
                <img th:src="@{/css/assets/calendar.svg}" alt="" aria-hidden="true">
                <span>Agenda y citas</span>
            </a>
            <a class="nav-item active" th:href="@{/admin/clientes}">
                <img th:src="@{/css/assets/clients.svg}" alt="" aria-hidden="true">
                <span>Clientes</span>
            </a>
            <a class="nav-item" th:href="@{/admin/servicios}">
                <img th:src="@{/css/assets/services.svg}" alt="" aria-hidden="true">
                <span>Servicios</span>
            </a>
            <a class="nav-item" th:href="@{/admin/reportes}">
                <img th:src="@{/css/assets/reports.svg}" alt="" aria-hidden="true">
                <span>Reportes</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span>Fisioterapeuta</span>
            <span>Ciudad / sede</span>
            <span>Horario de atención</span>
        </div>
    </aside>
    <main class="main-content">
        <header class="mobile-header">
            <button id="menuButton" class="menu-button">☰</button>
            <span>La Fisioterapeuta Li</span>
        </header>
        <section class="page active" id="clientes">
            <div class="page-header">
                <div>
                    <span class="eyebrow">GESTIÓN DE PACIENTES</span>
                    <h1>Clientes</h1>
                    <p>Consulta información básica y accede a la ficha.</p>
                </div>

                <button class="btn btn-gold" data-open-view="new-client">+ Crear cliente</button>
            </div>

            <div class="toolbar">
                <div class="filter-placeholder"></div>
                <button class="btn btn-outline">Filtrar</button>
            </div>

            <div class="panel">
                <div class="table-container">
                    <table class="wide-table">
                        <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Documento</th>
                            <th>Contacto</th>
                            <th>EPS</th>
                            <th>Referidos</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="clinical-history">Ver historial clínico</button></td>
                        </tr>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="clinical-history">Ver historial clínico</button></td>
                        </tr>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="clinical-history">Ver historial clínico</button></td>
                        </tr>
                        <tr>
                            <td></td><td></td><td></td><td></td><td></td><td><span class="status"></span></td>
                            <td><button class="table-action" data-open-view="clinical-history">Ver historial clínico</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
<!-- Ruta exclusiva de Thymeleaf apuntando a static/js/ -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
